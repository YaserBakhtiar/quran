<style>

#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,20px);padding:10px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:20;pointer-events:none;font-size:14px}#toast.on{opacity:1;transform:translate(-50%,0)}
#idx{position:absolute;inset:0;z-index:6;display:none;color:var(--ink);--ink:#f7efe4;--mute:#b9a9a3;--line:rgba(255,255,255,.1);--gc:255,255,255;--g0:.09}
#idx.on{display:block}
#idx .bk{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fi .2s}
#idx .sheet{position:absolute;left:0;right:0;bottom:0;height:86%;display:flex;flex-direction:column;gap:10px;padding:14px 16px calc(var(--sab) + 12px);border-radius:28px 28px 0 0;background:rgba(24,12,17,.94);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);border-top:1px solid rgba(255,255,255,.16);animation:up .3s cubic-bezier(.2,.8,.2,1)}
#idx .sh-h{display:flex;gap:10px;align-items:center;flex:none}#idx .seg{flex:1;margin:0}

.row.cur{background:rgba(var(--gc),.1);border-radius:14px;padding-inline:10px;margin-inline:-10px}.row.cur .t{color:var(--sand)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function show(v){$$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='home')home();if(v==='marks')renderMarks();if(v==='off')offUI()}

$('#hGo').onclick=()=>open(page);

$('#quick').onclick=e=>{const s=e.target.dataset.s;if(s!=null)open(ST[s])};

if(!navigator.standalone&&/iphone|ipad/i.test(navigator.userAgent))$('#inst').style.display='block';

const qn=s=>s.trim().replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);
function listHTML(m,q){let h='';const cs=page>COVER?sOf(page):-1,cj=jOf(page)-1;
 if(m==='s')SN.forEach((n,i)=>{if(q&&!n.includes(q)&&!SF[i].includes(q)&&String(i+1)!==q)return;h+=`<button class="row${i===cs?' cur':''}" data-p="${ST[i]}"><span class="num"><b>${nf(i+1)}</b></span><span class="t">${nm(i)}</span><small>${t('page')} ${nf(ST[i])}</small></button>`});
 else JS.forEach((p,i)=>{if(q&&String(i+1)!==q)return;h+=`<button class="row${i===cj?' cur':''}" data-p="${p}"><span class="num"><b>${nf(i+1)}</b></span><span class="t">${t('pj')} ${nf(i+1)}</span><small>${nmP(p)} · ${nf(p)}</small></button>`});
 return h||`<div class="empty">${t('nf')}</div>`}
function renderList(){$('#list').innerHTML=listHTML(mode,qn($('#q').value))}

$('#list').onclick=e=>{const r=e.target.closest('.row');r&&open(+r.dataset.p)};$('#q').oninput=renderList;
$$('#v-index .seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('#v-index .seg button').forEach(x=>x.classList.toggle('on',x===b));renderList()});

$('#mlist').onclick=e=>{const d=e.target.dataset.d;if(d){marks=marks.filter(x=>x!==+d);st.s('marks',marks);renderMarks();return}const r=e.target.closest('[data-p]');r&&open(+r.dataset.p)};

/* ---------- خواننده ---------- */
const R=$('#reader'),pg=$('#pg'),stage=$('#stage');
function setTheme(x){theme=x;document.body.dataset.t=x;st.s('theme',x);$$('#themes button').forEach(b=>b.classList.toggle('on',b.dataset.t===x))}
function go(p,dir){page=clamp(p);st.s('page',page);$('#err').style.display='none';resetZ();
 pg.style.setProperty('--d',dir>0?'-18px':'18px');pg.classList.remove('fl');void pg.offsetWidth;pg.classList.add('fl');pg.src=IMG(page);
 $('#rS').textContent=nmT(page);$('#rM').textContent=`${t('pj')} ${nf(jOf(page))} · ${t('page')} ${nf(page)}`;$('#rMark').classList.toggle('on',marks.includes(page));
 [page+1,page-1,page+2].forEach(n=>n>=1&&n<=TOTAL&&(new Image().src=IMG(n)))}
pg.onerror=()=>{$('#err').style.display='grid'};
function open(p){R.classList.add('on');R.classList.remove('hide');history.pushState({r:1},'');go(p,0);lock()}

$('#rBack').onclick=()=>history.back();addEventListener('popstate',()=>{if(skip){skip=false;return}if(xo){closeIdx(true);return}R.classList.contains('on')&&close()});

/* ----- زوم دقیق: پینچ، دابل‌تپ، چرخ ماوس؛ سوایپ صفحه فقط وقتی زوم نیست ----- */
const Z={s:1,x:0,y:0},MAXZ=5,ptr=new Map();
let gest=false,mv=false,sx=0,sy=0,pd=0,pm=null,lt=0,lx=0,ly=0,tm;
function ctr(){const r=stage.getBoundingClientRect();return{x:r.left+pg.offsetLeft+pg.offsetWidth/2,y:r.top+pg.offsetTop+pg.offsetHeight/2}}
function clampAxis(v,sz,w,c){const lo=sz-c-w/2,hi=w/2-c;return lo>hi?0:Math.max(lo,Math.min(hi,v))}
function applyZ(anim){
 const w=pg.offsetWidth*Z.s,h=pg.offsetHeight*Z.s,cx=pg.offsetLeft+pg.offsetWidth/2,cy=pg.offsetTop+pg.offsetHeight/2;
 Z.x=clampAxis(Z.x,stage.clientWidth,w,cx);Z.y=clampAxis(Z.y,stage.clientHeight,h,cy);
 pg.style.transition=anim?'transform .25s ease':'none';
 pg.style.transform=(Z.s===1&&!Z.x&&!Z.y)?'':`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
 stage.classList.toggle('zm',Z.s>1.01)}
function resetZ(anim){Z.s=1;Z.x=0;Z.y=0;applyZ(anim)}
function zoomAt(fx,fy,ns){ns=Math.max(1,Math.min(MAXZ,ns));const c=ctr(),r=ns/Z.s;Z.x=(fx-c.x)-r*(fx-c.x-Z.x);Z.y=(fy-c.y)-r*(fy-c.y-Z.y);Z.s=ns}
const two=()=>{const [a,b]=[...ptr.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2}};
stage.addEventListener('pointerdown',e=>{
 if(ptr.size===0){gest=false;mv=false}
 ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});try{stage.setPointerCapture(e.pointerId)}catch{}
 if(ptr.size===1){sx=e.clientX;sy=e.clientY}
 else if(ptr.size===2){gest=true;clearTimeout(tm);lt=0;const g=two();pd=g.d;pm={x:g.x,y:g.y}}});
stage.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const ox=p.x,oy=p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptr.size>=2){const g=two();if(pd>0){zoomAt(g.x,g.y,Z.s*g.d/pd);Z.x+=g.x-pm.x;Z.y+=g.y-pm.y;applyZ()}pd=g.d;pm={x:g.x,y:g.y}}
 else if(ptr.size===1){if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)mv=true;if(Z.s>1.01&&!gest){Z.x+=e.clientX-ox;Z.y+=e.clientY-oy;applyZ()}}});
function pup(e,cancel){if(!ptr.delete(e.pointerId))return;pd=0;if(ptr.size>0)return;
 if(gest&&Z.s<1.05)resetZ(true);
 const was=gest;gest=false;if(cancel||was)return;
 const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Z.s<1.01&&Math.abs(dx)>50&&Math.abs(dx)>1.5*Math.abs(dy)){dx>0?go(page+1,1):go(page-1,-1);return}
 if(mv)return;
 const n=Date.now();
 if(n-lt<300&&Math.hypot(e.clientX-lx,e.clientY-ly)<40){clearTimeout(tm);lt=0;if(Z.s>1.01)resetZ(true);else{zoomAt(e.clientX,e.clientY,2.5);applyZ(true)}}
 else{lt=n;lx=e.clientX;ly=e.clientY;tm=setTimeout(()=>R.classList.toggle('hide'),300)}}
stage.addEventListener('pointerup',e=>pup(e,false));stage.addEventListener('pointercancel',e=>pup(e,true));
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Z.s*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0025)));if(Z.s<1.02)resetZ();else applyZ()},{passive:false});
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>{if(R.classList.contains('on'))e.preventDefault()},{passive:false}));

addEventListener('resize',()=>applyZ());

addEventListener('keydown',e=>{if(!R.classList.contains('on'))return;

 if(e.key==='+'||e.key==='='){const c=ctr();zoomAt(c.x,c.y,Z.s*1.4);applyZ(true)}
 if(e.key==='-'){const c=ctr();zoomAt(c.x,c.y,Z.s/1.4);if(Z.s<1.02)resetZ(true);else applyZ(true)}
 if(e.key==='0')resetZ(true);
 if(e.key==='Escape')history.back()});
let wl;async function lock(){try{if(wake&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch{}}

const CACHE='quran-img-v1';let run=false,stop=false,fail=0;
const have=async()=>window.caches?(await (await caches.open(CACHE)).keys()).length:0;
async function offUI(n){if(n==null)n=await have();$('#dBar').style.width=Math.min(100,n/TOTAL*100)+'%';
 $('#dTxt').textContent=t(n>=TOTAL?'dlDone':'dlD');let s=`${nf(n)} ${t('of')} ${nf(TOTAL)}`;
 try{const e=await navigator.storage.estimate();s+=` · ${nf((e.usage/1048576).toFixed(0))} ${t('mb')}`}catch{}if(fail&&!run)s+=` · ${nf(fail)} ${t('fail')}`;$('#dSub').textContent=s;appReady();
 $('#dBtn').textContent=t(run?'dlStop':n>=TOTAL?'dlOk':n?'dlRes':'dlStart');$('#dBtn').disabled=!run&&n>=TOTAL}
async function download(){if(run){stop=true;return}if(!window.caches)return;
 run=true;stop=false;fail=0;const c=await caches.open(CACHE),got=new Set((await c.keys()).map(r=>new URL(r.url).pathname));
 const todo=[];for(let p=1;p<=TOTAL;p++)if(!got.has(new URL(IMG(p),location.href).pathname))todo.push(p);
 let n=TOTAL-todo.length;try{navigator.storage.persist()}catch{}lock();offUI(n);
 const w=async()=>{while(todo.length&&!stop){const p=todo.shift();try{let r;for(let k=0;k<3&&!(r&&r.ok);k++)r=await fetch(IMG(p));if(!r.ok)throw 0;await c.put(IMG(p),r);n++}catch{fail++}offUI(n)}};
 await Promise.all([w(),w(),w(),w()]);run=false;unlock();offUI();toast(t(stop?'paused':fail?'part':'done'))}
async function appReady(){let ok=false;try{ok=!!(await caches.match('index.html'))&&!!(await caches.match('manifest.json'))}catch{}$('#rdy').textContent=t(ok?'ready':'notReady')}
async function fontsUI(){const r=[];for(const f of['Vazirmatn','Almarai']){let ok=false;try{ok=(await document.fonts.load(`16px "${f}"`,'ابج')).length>0}catch{}r.push(f+(ok?' ✓':' ✗'))}$('#fnt').textContent=r.join(' · ');$('#fntH').textContent=r.some(x=>x.includes('✗'))?t('fntH'):''}
$('#dBtn').onclick=download;
$('#dDel').onclick=async()=>{if(run||!confirm(t('delQ')))return;await caches.delete(CACHE);fail=0;offUI(0)};
$('#themes').onclick=e=>e.target.dataset.t&&setTheme(e.target.dataset.t);

setTheme(theme);$('#gl').value=gk;document.documentElement.style.setProperty('--gk',gk/100);$$('#wake button').forEach(b=>b.classList.toggle('on',+b.dataset.w===+wake));applyLang();fontsUI();
